<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0e14;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;font-family:'Segoe UI',sans-serif}
.container{text-align:center;position:relative}
.mode-badge{position:absolute;top:20px;right:20px;padding:8px 16px;background:rgba(0,212,255,0.1);border:1px solid rgba(0,212,255,0.3);border-radius:20px;color:#00d4ff;font-size:11px;letter-spacing:3px;text-transform:uppercase}
.orb-container{position:relative;width:180px;height:180px;margin:0 auto 30px;cursor:pointer}
.orb{width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 30% 30%,#00d4ff,#0033aa 60%,#001144);box-shadow:0 0 60px rgba(0,212,255,0.4),0 0 120px rgba(0,100,255,0.2),inset 0 0 60px rgba(255,255,255,0.05);animation:orbPulse 3s ease-in-out infinite;transition:all 0.3s}
.orb.active{box-shadow:0 0 100px rgba(0,212,255,0.7);animation:orbActive 0.5s infinite}
.orb-inner{position:absolute;top:15%;left:15%;width:70%;height:70%;border-radius:50%;background:radial-gradient(circle at 40% 40%,rgba(255,255,255,0.15),transparent 70%)}
.orb-ring{position:absolute;inset:-10px;border-radius:50%;border:2px solid rgba(0,212,255,0.3);animation:ringSpin 8s linear infinite}
@keyframes orbPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes orbActive{0%,100%{transform:scale(1.03)}50%{transform:scale(1.08)}}
@keyframes ringSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.status-text{color:#00d4ff;font-size:14px;letter-spacing:4px;margin-bottom:8px;font-weight:300;opacity:0.8}
.response-text{color:#fff;font-size:16px;max-width:500px;margin:0 auto 25px;min-height:24px;opacity:0;transition:opacity 0.3s;line-height:1.5}
.response-text.show{opacity:1}
.buttons{display:flex;gap:25px;justify-content:center}
.btn{width:65px;height:65px;border-radius:50%;border:2px solid rgba(0,212,255,0.4);background:rgba(0,212,255,0.05);color:#00d4ff;font-size:26px;cursor:pointer;transition:all 0.3s;display:flex;align-items:center;justify-content:center}
.btn:hover{background:rgba(0,212,255,0.15);border-color:#00d4ff;box-shadow:0 0 30px rgba(0,212,255,0.3);transform:scale(1.1)}
.btn.active{background:rgba(255,68,68,0.3);border-color:#ff4444;box-shadow:0 0 50px rgba(255,68,68,0.6);animation:btnPulse 0.8s infinite}
@keyframes btnPulse{0%,100%{box-shadow:0 0 30px rgba(255,68,68,0.3)}50%{box-shadow:0 0 60px rgba(255,68,68,0.7)}}
.text-input-area{display:none;margin-top:20px}
.text-input-area.show{display:flex;gap:10px;justify-content:center}
#textInput{padding:12px 20px;width:300px;background:rgba(255,255,255,0.05);border:1px solid rgba(0,212,255,0.3);border-radius:25px;color:#fff;font-size:14px;outline:none}
#textInput:focus{border-color:#00d4ff}
#textSend{padding:12px 20px;background:#00d4ff;border:none;border-radius:25px;color:#000;cursor:pointer;font-weight:bold}
.listening{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:none;justify-content:center;align-items:center;z-index:100}
.listening.show{display:flex}
.listening-wave{display:flex;gap:5px}
.listening-wave span{width:4px;height:40px;background:#00d4ff;border-radius:2px;animation:wave 0.5s infinite alternate}
.listening-wave span:nth-child(2){animation-delay:0.1s}
.listening-wave span:nth-child(3){animation-delay:0.2s}
.listening-wave span:nth-child(4){animation-delay:0.3s}
.listening-wave span:nth-child(5){animation-delay:0.4s}
@keyframes wave{from{height:10px}to{height:50px}}
.voice-caption{color:#fff;font-size:20px;margin-top:20px;letter-spacing:3px}
</style>
</head>
<body>

<div class="container">
    <div class="mode-badge" id="modeBadge">DEFAULT</div>
    <div class="status-text" id="statusText">JARVIS ONLINE</div>
    
    <div class="orb-container">
        <div class="orb" id="orb"><div class="orb-inner"></div></div>
        <div class="orb-ring"></div>
    </div>
    
    <div class="response-text" id="responseText"></div>
    
    <div class="buttons">
        <button class="btn" id="voiceBtn" title="Voice">🎤</button>
        <button class="btn" id="textBtn" title="Text">⌨️</button>
    </div>
    
    <div class="text-input-area" id="textInputArea">
        <input type="text" id="textInput" placeholder="Type command..." autocomplete="off">
        <button id="textSend">Send</button>
    </div>
</div>

<div class="listening" id="listening">
    <div style="text-align:center">
        <div class="listening-wave"><span></span><span></span><span></span><span></span><span></span></div>
        <div class="voice-caption">LISTENING</div>
    </div>
</div>

<script>
let ws, recognition, isListening = false, isSpeaking = false;

function connect(){
    ws = new WebSocket('ws://localhost:8765/ws');
    ws.onopen = ()=> document.getElementById('statusText').textContent = 'ONLINE';
    ws.onmessage = (e)=>{
        const d = JSON.parse(e.data);
        if(d.mode) document.getElementById('modeBadge').textContent = d.mode.toUpperCase();
        if(d.type==='response' || d.type==='ready'){
            showResponse(d.message);
            if(d.speak) speak(d.message);
        }
    };
    ws.onclose = ()=>{document.getElementById('statusText').textContent='RECONNECTING...';setTimeout(connect,2000)};
}

function send(cmd){
    if(ws && ws.readyState===1){
        // Stop any current speech
        if(isSpeaking) window.speechSynthesis.cancel();
        isSpeaking = false;
        
        ws.send(JSON.stringify({command:cmd, type:'text'}));
        document.getElementById('orb').classList.add('active');
        setTimeout(()=>document.getElementById('orb').classList.remove('active'),800);
    }
}

function showResponse(text){
    const el = document.getElementById('responseText');
    el.textContent = text;
    el.classList.add('show');
    setTimeout(()=>el.classList.remove('show'),6000);
}

function speak(text){
    if('speechSynthesis' in window){
        window.speechSynthesis.cancel(); // Stop any current speech
        const u = new SpeechSynthesisUtterance(text);
        u.rate = 0.9; u.pitch = 1.0; u.volume = 1;
        isSpeaking = true;
        u.onend = ()=> isSpeaking = false;
        const voices = speechSynthesis.getVoices();
        const male = voices.find(v=>v.name.includes('Male')||v.name.includes('David'));
        if(male) u.voice = male;
        speechSynthesis.speak(u);
    }
}

// Interrupt speech when user types
document.getElementById('textInput').addEventListener('input', ()=>{
    if(isSpeaking) window.speechSynthesis.cancel();
    isSpeaking = false;
});

if('webkitSpeechRecognition' in window){
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SR();
    recognition.continuous = false;
    recognition.lang = 'en-US';
    recognition.onstart = ()=>{
        isListening = true;
        document.getElementById('listening').classList.add('show');
        document.getElementById('voiceBtn').classList.add('active');
    };
    recognition.onresult = (e)=>{
        if(isSpeaking) window.speechSynthesis.cancel();
        send(e.results[0][0].transcript);
    };
    recognition.onend = ()=>{
        isListening = false;
        document.getElementById('listening').classList.remove('show');
        document.getElementById('voiceBtn').classList.remove('active');
    };
}

document.getElementById('voiceBtn').onclick = ()=> isListening ? recognition.stop() : recognition.start();
document.getElementById('textBtn').onclick = ()=>{
    document.getElementById('textInputArea').classList.toggle('show');
    document.getElementById('textInput').focus();
};
document.getElementById('textSend').onclick = ()=>{
    const i = document.getElementById('textInput');
    if(i.value.trim()){send(i.value.trim());i.value=''}
};
document.getElementById('textInput').onkeypress = e => {if(e.key==='Enter')document.getElementById('textSend').click()};

// Sync trackers silently
setInterval(()=>{
    try{
        const jee = JSON.parse(localStorage.getItem('jeeUltimate_v4')||'{}');
        const xp = parseInt(localStorage.getItem('userXP')||'0');
        const data = {
            habits:{},
            study:{
                totalHours:(jee.pomoCount||0)*0.5,
                pomodoro_count:jee.pomoCount||0,
                streak:jee.streak||0,
                level:jee.level||1,
                xp:xp,
                subjects:{}
            },
            expenses:[],marvel:[]
        };
        if(ws && ws.readyState===1){
            ws.send(JSON.stringify({command:`/sync ${JSON.stringify(data)}`}));
        }
    }catch(e){}
},15000);

connect();
</script>
</body>
</html>
