<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0e14;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;font-family:'Segoe UI',sans-serif}
.container{text-align:center;position:relative}

/* MODE BADGE */
.mode-badge{
    position:absolute;top:20px;right:20px;
    padding:8px 16px;
    background:rgba(0,212,255,0.1);
    border:1px solid rgba(0,212,255,0.3);
    border-radius:20px;
    color:#00d4ff;
    font-size:11px;
    letter-spacing:3px;
    text-transform:uppercase;
}

/* ORB */
.orb-container{position:relative;width:200px;height:200px;margin:0 auto 40px;cursor:pointer}
.orb{
    width:100%;height:100%;border-radius:50%;
    background:radial-gradient(circle at 30% 30%,#00d4ff,#0033aa 60%,#001144);
    box-shadow:0 0 60px rgba(0,212,255,0.4),0 0 120px rgba(0,100,255,0.2),inset 0 0 60px rgba(255,255,255,0.05);
    animation:orbPulse 3s ease-in-out infinite;
    position:relative;transition:all 0.3s;
}
.orb.active{box-shadow:0 0 100px rgba(0,212,255,0.7),0 0 200px rgba(0,100,255,0.4);animation:orbActive 0.5s infinite}
.orb-inner{position:absolute;top:15%;left:15%;width:70%;height:70%;border-radius:50%;background:radial-gradient(circle at 40% 40%,rgba(255,255,255,0.15),transparent 70%)}
.orb-ring{position:absolute;inset:-10px;border-radius:50%;border:2px solid rgba(0,212,255,0.3);animation:ringSpin 8s linear infinite}
.orb-ring:nth-child(3){inset:-20px;border-color:rgba(0,212,255,0.1);animation-duration:12s;animation-direction:reverse}

@keyframes orbPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes orbActive{0%,100%{transform:scale(1.03)}50%{transform:scale(1.08)}}
@keyframes ringSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

/* STATUS */
.status-text{color:#00d4ff;font-size:14px;letter-spacing:4px;text-transform:uppercase;margin-bottom:10px;min-height:20px;font-weight:300;opacity:0.8}
.response-text{color:#fff;font-size:16px;max-width:500px;margin:0 auto 30px;min-height:24px;opacity:0;transition:opacity 0.3s;line-height:1.5}
.response-text.show{opacity:1}

/* BUTTONS */
.buttons{display:flex;gap:30px;justify-content:center}
.btn{
    width:70px;height:70px;border-radius:50%;
    border:2px solid rgba(0,212,255,0.4);
    background:rgba(0,212,255,0.05);
    color:#00d4ff;font-size:28px;cursor:pointer;
    transition:all 0.3s;
    display:flex;align-items:center;justify-content:center;
}
.btn:hover{background:rgba(0,212,255,0.15);border-color:#00d4ff;box-shadow:0 0 30px rgba(0,212,255,0.3);transform:scale(1.1)}
.btn.active{background:rgba(0,212,255,0.3);border-color:#fff;box-shadow:0 0 50px rgba(0,212,255,0.6);animation:btnPulse 0.8s infinite}
@keyframes btnPulse{0%,100%{box-shadow:0 0 30px rgba(0,212,255,0.3)}50%{box-shadow:0 0 60px rgba(0,212,255,0.7)}}

/* TEXT INPUT */
.text-input-area{display:none;margin-top:20px}
.text-input-area.show{display:flex;gap:10px;justify-content:center}
#textInput{padding:12px 20px;width:300px;background:rgba(255,255,255,0.05);border:1px solid rgba(0,212,255,0.3);border-radius:25px;color:#fff;font-size:14px;outline:none}
#textInput:focus{border-color:#00d4ff}
#textSend{padding:12px 20px;background:#00d4ff;border:none;border-radius:25px;color:#000;cursor:pointer;font-weight:bold}

/* LISTENING */
.listening{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:none;justify-content:center;align-items:center;z-index:100}
.listening.show{display:flex}
.listening-wave{display:flex;gap:5px}
.listening-wave span{width:4px;height:40px;background:#00d4ff;border-radius:2px;animation:wave 0.5s infinite alternate}
.listening-wave span:nth-child(2){animation-delay:0.1s}
.listening-wave span:nth-child(3){animation-delay:0.2s}
.listening-wave span:nth-child(4){animation-delay:0.3s}
.listening-wave span:nth-child(5){animation-delay:0.4s}
@keyframes wave{from{height:10px}to{height:50px}}
.voice-caption{color:#fff;font-size:24px;margin-top:20px;text-align:center;letter-spacing:2px}
</style>
</head>
<body>

<div class="container">
    <div class="mode-badge" id="modeBadge">DEFAULT</div>
    <div class="status-text" id="statusText">JARVIS ONLINE</div>
    
    <div class="orb-container" id="orbContainer">
        <div class="orb" id="orb"><div class="orb-inner"></div></div>
        <div class="orb-ring"></div><div class="orb-ring"></div>
    </div>
    
    <div class="response-text" id="responseText"></div>
    
    <div class="buttons">
        <button class="btn" id="voiceBtn" title="Voice">🎤</button>
        <button class="btn" id="textBtn" title="Text">⌨️</button>
    </div>
    
    <div class="text-input-area" id="textInputArea">
        <input type="text" id="textInput" placeholder="Type command..." autocomplete="off">
        <button id="textSend">Send</button>
    </div>
</div>

<div class="listening" id="listening">
    <div style="text-align:center">
        <div class="listening-wave"><span></span><span></span><span></span><span></span><span></span></div>
        <div class="voice-caption">LISTENING</div>
    </div>
</div>

<script>
let ws, recognition, isListening = false;

// ============ TRACKER READER ============
function readAllTrackers() {
    const trackers = {
        habits: {},
        study: {},
        expenses: {},
        marvel: {}
    };
    
    try {
        // Read from localStorage (all your tracker keys)
        const habitData = localStorage.getItem('habits');
        if (habitData) trackers.habits = JSON.parse(habitData);
        
        const studyData = localStorage.getItem('study');
        if (studyData) trackers.study = JSON.parse(studyData);
        
        const expenseData = localStorage.getItem('expenses');
        if (expenseData) trackers.expenses = JSON.parse(expenseData);
        
        const marvelData = localStorage.getItem('marvel');
        if (marvelData) trackers.marvel = JSON.parse(marvelData);
        
        // Also check alternative keys you might use
        const altHabits = localStorage.getItem('habitTracker');
        if (altHabits) trackers.habits = JSON.parse(altHabits);
        
        const altStudy = localStorage.getItem('studyTracker');
        if (altStudy) trackers.study = JSON.parse(altStudy);
        
        const altExpenses = localStorage.getItem('expenseTracker');
        if (altExpenses) trackers.expenses = JSON.parse(altExpenses);
        
    } catch(e) {
        console.log('Tracker read error:', e);
    }
    
    return trackers;
}

function getTrackerSummary() {
    const t = readAllTrackers();
    let summary = "";
    
    // Habits
    const habits = t.habits;
    if (habits && Object.keys(habits).length > 0) {
        const done = Object.values(habits).filter(v => v === true || v === 1 || v === 'done').length;
        const total = Object.keys(habits).length;
        summary += `Habits: ${done}/${total} done. `;
    }
    
    // Study
    const study = t.study;
    if (study && study.totalHours) {
        summary += `Study: ${study.totalHours}h. `;
        if (study.subjects) {
            const subjects = Object.entries(study.subjects).map(([k,v]) => `${k}:${v}h`).join(', ');
            summary += `(${subjects}) `;
        }
    }
    
    // Expenses
    const expenses = t.expenses;
    if (expenses && Array.isArray(expenses) && expenses.length > 0) {
        const today = new Date().toDateString();
        const todayExpenses = expenses.filter(e => new Date(e.date).toDateString() === today);
        const total = todayExpenses.reduce((sum, e) => sum + (e.amount || 0), 0);
        if (total > 0) summary += `Spent today: ₹${total}. `;
    }
    
    // Marvel
    const marvel = t.marvel;
    if (marvel && Array.isArray(marvel)) {
        const watched = marvel.filter(m => m.watched).length;
        summary += `Marvel: ${watched}/${marvel.length} watched. `;
    }
    
    return summary || "No tracker data available.";
}

// ============ WEBSOCKET ============
function connect(){
    ws = new WebSocket('ws://localhost:8765/ws');
    
    ws.onopen = () => {
        document.getElementById('statusText').textContent = 'ONLINE';
        
        // Send tracker data on connect
        const trackers = readAllTrackers();
        if (Object.values(trackers).some(t => Object.keys(t).length > 0)) {
            ws.send(JSON.stringify({
                command: `/sync ${JSON.stringify(trackers)}`
            }));
        }
    };
    
    ws.onmessage = (e) => {
        const d = JSON.parse(e.data);
        if(d.mode) document.getElementById('modeBadge').textContent = d.mode.toUpperCase();
        if(d.type === 'response' || d.type === 'ready'){
            showResponse(d.message);
            if(d.speak) speak(d.message);
        }
    };
    
    ws.onclose = () => {
        document.getElementById('statusText').textContent = 'RECONNECTING...';
        setTimeout(connect, 2000);
    };
}

// ============ SEND COMMAND ============
function send(cmd){
    if(ws && ws.readyState === 1){
        // Always attach tracker context
        const summary = getTrackerSummary();
        const fullCmd = cmd.includes('/sync') ? cmd : cmd;
        
        ws.send(JSON.stringify({
            command: fullCmd,
            tracker_summary: summary
        }));
        
        document.getElementById('orb').classList.add('active');
        setTimeout(() => document.getElementById('orb').classList.remove('active'), 1000);
    }
}

// ============ SPEAK ============
function speak(text){
    if('speechSynthesis' in window){
        const u = new SpeechSynthesisUtterance(text);
        u.rate = 0.9;
        u.pitch = 1.0;
        u.volume = 1;
        const voices = speechSynthesis.getVoices();
        const male = voices.find(v => v.name.includes('Male') || v.name.includes('David') || v.name.includes('Daniel'));
        if(male) u.voice = male;
        speechSynthesis.speak(u);
    }
}

function showResponse(text){
    const el = document.getElementById('responseText');
    el.textContent = text;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 8000);
}

// ============ VOICE ============
if('webkitSpeechRecognition' in window){
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SR();
    recognition.continuous = false;
    recognition.lang = 'en-US';
    recognition.onstart = () => {
        isListening = true;
        document.getElementById('listening').classList.add('show');
        document.getElementById('voiceBtn').classList.add('active');
    };
    recognition.onresult = (e) => send(e.results[0][0].transcript);
    recognition.onend = () => {
        isListening = false;
        document.getElementById('listening').classList.remove('show');
        document.getElementById('voiceBtn').classList.remove('active');
    };
}

// ============ BUTTONS ============
document.getElementById('voiceBtn').onclick = () => isListening ? recognition.stop() : recognition.start();
document.getElementById('textBtn').onclick = () => {
    document.getElementById('textInputArea').classList.toggle('show');
    document.getElementById('textInput').focus();
};
document.getElementById('textSend').onclick = () => {
    const i = document.getElementById('textInput');
    if(i.value.trim()){ send(i.value.trim()); i.value = ''; }
};
document.getElementById('textInput').onkeypress = e => {
    if(e.key === 'Enter') document.getElementById('textSend').click();
};

// ============ START ============
connect();

// Auto-sync trackers every 30 seconds
setInterval(() => {
    if(ws && ws.readyState === 1){
        const trackers = readAllTrackers();
        ws.send(JSON.stringify({
            command: `/sync ${JSON.stringify(trackers)}`
        }));
    }
}, 30000);
</script>
    <script>

        const data = {
            habits: {
                physics_revision: jeeData.tasks?.physics?.length > 0,
                chemistry_revision: jeeData.tasks?.chemistry?.length > 0,

                mock_test: jeeData.mockTests?.length > 0,
                pomodoro: jeeData.pomoCount > 0
            },
            study: {

                subjects: {
                    physics: jeeData.tasks?.physics?.filter(t => t.done).length || 0,
                    chemistry: jeeData.tasks?.chemistry?.filter(t => t.done).length || 0,
                    math: jeeData.tasks?.math?.filter(t => t.done).length || 0
                },
                pomodoro_count: jeeData.pomoCount || 0,
                streak: jeeData.streak || 0,
                level: jeeData.level || 1,
                xp: parseInt(xp)
            },
            expenses: [], // Add if you have expense tracker
            marvel: []    // Add if you have marvel tracker
        };
        
        console.log('Syncing to JARVIS:', data);
        
        fetch('http://localhost:8765/sync', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data)
        }).then(r => r.json()).then(d => console.log('JARVIS:', d))
          .catch(() => {}); // JARVIS not running
        
    } catch(e) {
        console.log('Sync error:', e);
    }
}, 10000); // Every 10 seconds
</script>
</body>
</html>
