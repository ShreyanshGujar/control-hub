<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marvel Archive | Hero's Journey</title>
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;600;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --marvel-red: #e23636;
            --deep-crimson: #8b0000;
            --netflix-black: #050505;
            --xp-gold: #ffcc00;
            --rank-glow: rgba(255, 204, 0, 0.5);
        }

        body, html {
            margin: 0; padding: 0;
            background-color: black;
            color: white; font-family: 'Inter', sans-serif;
            overflow: hidden; height: 100vh;
        }

        /* --- 🎞️ THE LOGO --- */
        #intro-overlay {
            position: fixed; inset: 0; z-index: 5000;
            display: flex; align-items: center; justify-content: center;
            background: black; pointer-events: none;
            transition: background 1s ease;
        }
        
        .marvel-logo-main {
            font-family: 'Bebas Neue', sans-serif; 
            font-size: clamp(3rem, 8vw, 6rem);
            color: white; padding: 0 20px; transform: scaleY(1.1); opacity: 0;
            background: transparent; border: 4px solid white;
            z-index: 5100;
        }

        .run-glide { animation: glideUp 2.5s cubic-bezier(0.7, 0, 0.3, 1) forwards; }
        
        @keyframes glideUp {
            0% { transform: scaleY(1.1) translateY(0); opacity: 0; }
            10% { opacity: 1; }
            60% { transform: scaleY(1.1) translateY(0); border-color: white; }
            100% { transform: scaleY(1.1) translateY(-32vh); opacity: 1; border-color: transparent; }
        }

        /* --- 🎖️ XP DASHBOARD & ANIMATIONS --- */
        #xp-bar-container {
            position: fixed; top: 25px; right: 25px; width: 260px; z-index: 5500;
            background: rgba(0,0,0,0.85); border-radius: 16px; padding: 15px;
            backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.15);
            opacity: 0; transition: all 0.5s ease 2s;
        }

        .xp-gain-pulse { animation: xpPulse 0.4s ease-out; }
        @keyframes xpPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); border-color: var(--xp-gold); box-shadow: 0 0 25px var(--xp-gold); }
            100% { transform: scale(1); }
        }

        #xp-fill { height: 8px; background: linear-gradient(90deg, var(--xp-gold), #fff); width: 0%; border-radius: 10px; transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
        #rank-display { font-family: 'Bebas Neue'; font-size: 1.3rem; color: var(--xp-gold); display: block; margin-bottom: 6px; letter-spacing: 1px; }

        /* FLOATING XP TEXT */
        .floating-xp {
            position: fixed; color: var(--xp-gold); font-family: 'Bebas Neue';
            font-size: 2rem; pointer-events: none; z-index: 9000;
            animation: floatUp 0.8s ease-out forwards;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-100px) scale(1.2); opacity: 0; }
        }

        /* REWARD NOTIFICATION */
        #reward-toast {
            position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
            background: var(--xp-gold); color: black; padding: 12px 35px;
            border-radius: 50px; font-family: 'Bebas Neue'; font-size: 1.6rem;
            z-index: 8000; display: none; box-shadow: 0 0 40px rgba(255, 204, 0, 0.5);
            animation: rewardSlide 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes rewardSlide { from { bottom: -100px; } to { bottom: 40px; } }

        /* --- 🎨 HOME VIEW --- */
        #home-view {
            height: 100vh;
            background: linear-gradient(180deg, var(--deep-crimson) 0%, var(--marvel-red) 15%, var(--netflix-black) 50%);
            opacity: 0; transition: opacity 1.5s ease;
            display: flex; flex-direction: column;
        }
        
        #hub-view { flex: 1; margin-top: 30vh; padding: 0 5%; z-index: 10; text-align: center; }
        
        .hub-title { font-family: 'Bebas Neue'; font-size: 2.5rem; letter-spacing: 6px; margin-bottom: 5px; }
        .timeline-container { display: flex; overflow-x: auto; padding: 20px 0 60px; gap: 30px; scrollbar-width: none; }

        .phase-card {
            flex: 0 0 210px; aspect-ratio: 2/3; border-radius: 12px;
            overflow: hidden; cursor: pointer; transition: 0.5s cubic-bezier(0.2, 1, 0.2, 1);
            border: 1px solid rgba(255,255,255,0.1); position: relative;
        }
        .phase-card:hover { transform: scale(1.1) translateY(-10px); z-index: 100; border-color: white; }
        .phase-card img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
        
        .phase-meta {
            position: absolute; bottom: 0; width: 100%; padding: 15px 0;
            background: linear-gradient(to top, black 50%, transparent);
            font-family: 'Bebas Neue'; text-align: center;
        }
        .mini-progress-bg { width: 80%; height: 4px; background: rgba(255,255,255,0.2); margin: 0 auto; border-radius: 10px; overflow: hidden; }
        .mini-progress-fill { height: 100%; background: var(--marvel-red); width: 0%; transition: width 1s ease; }

        /* --- 🎞️ PHASE VIEW --- */
        #phase-view { 
            display: none; position: fixed; inset: 0; 
            padding: 180px 8% 40px; 
            background: var(--netflix-black); overflow-y: auto; z-index: 4000; 
        }
        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 35px; max-width: 1400px; margin: 0 auto; }
        .card { border-radius: 10px; overflow: hidden; cursor: pointer; transition: 0.4s ease; border: 1px solid #222; position: relative; }
        .card img { width: 100%; display: block; }
        .card.watched::after { content: '✓'; position: absolute; top: 10px; right: 10px; background: var(--marvel-red); color: white; width: 25px; height: 25px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; }

        .back-btn { position: fixed; top: 30px; left: 30px; background: white; color: black; border: none; padding: 12px 25px; border-radius: 50px; font-weight: 900; cursor: pointer; z-index: 6000; font-family: 'Bebas Neue'; }

        /* --- 📋 DETAIL VIEW --- */
        #detail-view { position: fixed; inset: 0; background: rgba(0,0,0,0.96); backdrop-filter: blur(30px); z-index: 7000; display: none; align-items: center; justify-content: center; }
        .detail-content { width: 90%; max-width: 900px; background: #0a0a0a; border-radius: 20px; overflow: hidden; position: relative; border: 1px solid #333; }
        .detail-hero { height: 45vh; background-size: cover; background-position: center; }
        .detail-body { padding: 40px; }
        #comp-btn { padding: 15px 45px; margin-top: 25px; border: none; cursor: pointer; font-family: 'Bebas Neue'; font-size: 1.5rem; border-radius: 8px; }

        /* --- ⚡ RANK UP --- */
        #level-up-overlay { position: fixed; inset: 0; z-index: 9999; background: black; display: none; align-items: center; justify-content: center; }
        .super-text { font-family: 'Bebas Neue'; font-size: 8rem; color: var(--xp-gold); margin: 0; text-align: center; }
        .shake { animation: heavyShake 0.5s ease-in-out; }
        @keyframes heavyShake { 0%, 100% { transform: translate(0,0); } 25% { transform: translate(-10px,5px); } 50% { transform: translate(10px,-5px); } }
    </style>
</head>
<body id="main-body">

<div id="intro-overlay"><div class="marvel-logo-main" id="moving-logo">MARVEL</div></div>

<div id="xp-bar-container">
    <span id="rank-display">RANK: RECRUIT</span>
    <div style="background: rgba(255,255,255,0.1); border-radius: 10px; height: 8px; overflow: hidden;">
        <div id="xp-fill"></div>
    </div>
    <div style="font-size: 0.75rem; margin-top: 8px; color: #888;">LEVEL <span id="lvl-num">1</span> • <span id="xp-num">0</span>/500 XP</div>
</div>

<div id="home-view">
    <div id="hub-view">
        <h2 class="hub-title">TIMELINE</h2>
        <div style="font-size:0.9rem; color:#aaa; margin-bottom:15px;">TOTAL COMPLETION: <span id="global-perc" style="color:var(--marvel-red)">0%</span></div>
        <div class="timeline-container" id="hub-grid"></div>
    </div>
</div>

<div id="phase-view">
    <button class="back-btn" onclick="goHome()">← BACK</button>
    <div class="movie-grid" id="movie-grid"></div>
</div>

<div id="detail-view">
    <div class="detail-content">
        <div style="position:absolute; top:20px; right:25px; font-size:2.5rem; cursor:pointer;" onclick="closeDetail()">✕</div>
        <div id="detail-hero" class="detail-hero"></div>
        <div class="detail-body">
            <h2 id="m-title" style="font-family:'Bebas Neue'; font-size:3.5rem; margin:0;"></h2>
            <p id="m-desc" style="color:#aaa; line-height:1.6;"></p>
            <button id="comp-btn"></button>
        </div>
    </div>
</div>

<div id="level-up-overlay">
    <div style="text-align:center;">
        <h1 class="super-text">RANK UP!</h1>
        <h2 id="rank-up-name" style="font-size:3rem; margin:0; color:white; font-family:'Bebas Neue';"></h2>
        <button onclick="closeAscension()" style="margin-top:30px; padding:15px 50px; font-family:'Bebas Neue'; font-size:1.5rem; cursor:pointer; background:white; color:black; border:none; border-radius:4px;">CONTINUE</button>
    </div>
</div>

<div id="reward-toast"></div>

<audio id="music-player" loop></audio>

<script>
    const API_KEY = 'd52501009c92b249f9da2c1f2bf6926e';
    const mcuData = {
        "Phase 1": { music: "avengers_classic.mp3", heroMovie: "The Avengers", movies: ["Iron Man", "The Incredible Hulk", "Iron Man 2", "Thor", "Captain America: First Avenger", "The Avengers"] },
        "Phase 2": { music: "avengers_age.mp3", heroMovie: "Age of Ultron", movies: ["Iron Man 3", "Thor: Dark World", "Winter Soldier", "Guardians of the Galaxy", "Age of Ultron", "Ant-Man"] },
        "Phase 3": { music: "endgame.mp3", heroMovie: "Endgame", movies: ["Civil War", "Doctor Strange", "GotG Vol 2", "Spider-Man Homecoming", "Thor Ragnarok", "Black Panther", "Infinity War", "Ant-Man and the Wasp", "Captain Marvel", "Endgame", "Far From Home"] },
        "Phase 4": { music: "loki_vibe.mp3", heroMovie: "No Way Home", movies: ["WandaVision", "Black Widow", "Loki", "Shang-Chi", "Eternals", "Spider-Man: No Way Home", "Doctor Strange 2", "Thor: Love and Thunder", "Black Panther: Wakanda Forever"] },
        "Phase 5": { music: "avengers_classic.mp3", heroMovie: "Deadpool & Wolverine", movies: ["Ant-Man: Quantumania", "Guardians 3", "Secret Invasion", "The Marvels", "Echo", "Deadpool & Wolverine", "Agatha All Along"] },
        "Phase 6": { music: "high_stakes.mp3", heroMovie: "Avengers Doomsday", movies: ["The Fantastic Four: First Steps", "Avengers: Doomsday", "Spider-Man: Brand New Day", "Avengers: Secret Wars"] },
        "Defender Saga": { music: "avengers_age.mp3", heroMovie: "Daredevil", movies: ["Daredevil", "Jessica Jones", "Luke Cage", "Iron Fist", "The Defenders", "The Punisher"] },
        "Spider-Man": { music: "spider_theme.mp3", heroMovie: "Spider-Man 2", movies: ["Spider-Man 2002", "Spider-Man 2", "Spider-Man 3", "The Amazing Spider-Man", "The Amazing Spider-Man 2"] },
        "X-Men": { music: "xmen_theme.mp3", heroMovie: "Logan", movies: ["X-Men", "X2", "X-Men: First Class", "Days of Future Past", "Deadpool", "Logan", "Deadpool 2"] }
    };

    let userXP = parseInt(localStorage.getItem('userXP')) || 0;
    let currentLvl = Math.floor(userXP / 500) + 1;
    const rankTitles = ["RECRUIT", "AGENT", "HERO", "AVENGER", "COSMIC", "WATCHER", "SUPREME"];

    window.onload = () => {
        document.getElementById('moving-logo').classList.add('run-glide');
        setTimeout(() => {
            document.getElementById('intro-overlay').style.background = "transparent";
            document.getElementById('home-view').style.opacity = "1";
            document.getElementById('xp-bar-container').style.opacity = "1";
            initTimeline();
            updateXPDisplay(true);
        }, 2500);
    };

    async function initTimeline() {
        const grid = document.getElementById('hub-grid');
        grid.innerHTML = '';
        for (const phase in mcuData) {
            const res = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${API_KEY}&query=${encodeURIComponent(mcuData[phase].heroMovie)}`);
            const data = await res.json();
            const movie = data.results.find(m => m.poster_path) || data.results[0];
            const card = document.createElement('div');
            card.className = 'phase-card';
            card.innerHTML = `
                <img src="https://image.tmdb.org/t/p/w500${movie.poster_path}">
                <div class="phase-meta">
                    <div style="font-size:1.4rem;">${phase}</div>
                    <div class="mini-progress-bg"><div id="bar-${phase.replace(/\s/g, '')}" class="mini-progress-fill"></div></div>
                </div>`;
            card.onclick = () => enterPhase(phase);
            grid.appendChild(card);
        }
        updateProgressUI();
    }

    function enterPhase(phase) {
        document.getElementById('home-view').style.display = 'none';
        document.getElementById('phase-view').style.display = 'block';
        document.getElementById('music-player').src = mcuData[phase].music;
        document.getElementById('music-player').play().catch(() => {});
        loadMovies(phase);
    }

    function goHome() {
        document.getElementById('music-player').pause();
        document.getElementById('phase-view').style.display = 'none';
        document.getElementById('home-view').style.display = 'flex';
        updateProgressUI();
    }

    async function loadMovies(phase) {
        const grid = document.getElementById('movie-grid');
        grid.innerHTML = '<p style="grid-column:1/-1; text-align:center;">Summoning Heroes...</p>';
        for (const title of mcuData[phase].movies) {
            const res = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${API_KEY}&query=${encodeURIComponent(title)}`);
            const data = await res.json();
            const movie = data.results.find(m => m.poster_path) || data.results[0];
            if (!movie) continue;
            const isW = localStorage.getItem(title) === 'true';
            const card = document.createElement('div');
            card.className = `card ${isW ? 'watched' : ''}`;
            card.id = `card-${title.replace(/\s/g, '')}`;
            card.innerHTML = `<img src="https://image.tmdb.org/t/p/w500${movie.poster_path}">`;
            card.onclick = () => openDetail(title, movie);
            grid.appendChild(card);
        }
        grid.querySelector('p')?.remove();
    }

    function spawnXPText(e) {
        const floating = document.createElement('div');
        floating.className = 'floating-xp';
        floating.innerText = '+100 XP';
        floating.style.left = e.clientX + 'px';
        floating.style.top = e.clientY + 'px';
        document.body.appendChild(floating);
        setTimeout(() => floating.remove(), 800);
    }

    function openDetail(title, data) {
        document.getElementById('detail-view').style.display = 'flex';
        document.getElementById('detail-hero').style.backgroundImage = `url(https://image.tmdb.org/t/p/original${data.backdrop_path})`;
        document.getElementById('m-title').innerText = title;
        document.getElementById('m-desc').innerText = data.overview;
        const btn = document.getElementById('comp-btn');
        const update = () => {
            const w = localStorage.getItem(title) === 'true';
            btn.innerText = w ? "✓ WATCHED" : "MARK WATCHED";
            btn.style.background = w ? "var(--marvel-red)" : "white";
            btn.style.color = w ? "white" : "black";
            const c = document.getElementById(`card-${title.replace(/\s/g, '')}`);
            if(c) w ? c.classList.add('watched') : c.classList.remove('watched');
        };
        update();
        btn.onclick = (e) => {
            const w = localStorage.getItem(title) === 'true';
            if(!w) { 
                userXP += 100; 
                confetti({ particleCount: 40 }); 
                spawnXPText(e); // SHOW THE +100 XP TEXT
            } else { 
                userXP = Math.max(0, userXP - 100); 
            }
            localStorage.setItem(title, !w);
            updateXPDisplay();
            update();
        };
    }

    function closeDetail() { document.getElementById('detail-view').style.display = 'none'; }

    function updateXPDisplay(init = false) {
        const lvl = Math.floor(userXP / 500) + 1;
        if (!init && lvl > currentLvl) triggerRankUp(lvl);
        
        if(!init) {
            const bar = document.getElementById('xp-bar-container');
            bar.classList.remove('xp-gain-pulse');
            void bar.offsetWidth; 
            bar.classList.add('xp-gain-pulse');
        }

        currentLvl = lvl;
        document.getElementById('xp-fill').style.width = (userXP % 500 / 5) + "%";
        document.getElementById('lvl-num').innerText = lvl;
        document.getElementById('xp-num').innerText = userXP % 500;
        let rI = Math.min(Math.floor(lvl / 3), rankTitles.length - 1);
        document.getElementById('rank-display').innerText = `RANK: ${rankTitles[rI]}`;
        localStorage.setItem('userXP', userXP);
    }

    function updateProgressUI() {
        let t = 0, w = 0;
        for (const p in mcuData) {
            let pT = mcuData[p].movies.length, pW = 0;
            mcuData[p].movies.forEach(m => { if(localStorage.getItem(m) === 'true') { pW++; w++; } t++; });
            
            if (pW === pT && pT > 0 && !localStorage.getItem('reward_' + p)) {
                userXP += 500;
                localStorage.setItem('reward_' + p, 'true');
                showRewardToast(`PHASE COMPLETE: +500 XP REWARD!`);
                updateXPDisplay();
            }

            const b = document.getElementById(`bar-${p.replace(/\s/g, '')}`);
            if(b) b.style.width = (pW / pT * 100) + "%";
        }
        document.getElementById('global-perc').innerText = Math.round((w / t) * 100) + "%";
    }

    function showRewardToast(msg) {
        const toast = document.getElementById('reward-toast');
        toast.innerText = msg;
        toast.style.display = 'block';
        confetti({ particleCount: 200, spread: 100, origin: { y: 0.8 }, colors: ['#ffcc00', '#ffffff', '#e23636'] });
        setTimeout(() => { toast.style.display = 'none'; }, 4000);
    }

    function triggerRankUp(lvl) {
        document.getElementById('rank-up-name').innerText = `LEVEL ${lvl}`;
        document.getElementById('level-up-overlay').style.display = 'flex';
        document.getElementById('main-body').classList.add('shake');
        confetti({ particleCount: 300, spread: 90, colors: ['#ffcc00', '#ffffff'] });
    }

    function closeAscension() {
        document.getElementById('level-up-overlay').style.display = 'none';
        document.getElementById('main-body').classList.remove('shake');
    }
</script>
